<div id="tostay" class="col-xl-6 col-lg-7 ml-auto mr-auto">
        <h3 class="title">To Stay:</h3>
            {% for post in site.tostay %}
            {% if post.area == page.areaname %}
        <div class="card card-profile">
          <div class="row">
            <div class="col-md-8">
              <div class="card-body">
                <h3 class="card-title">{{post.name}}</h3>
                <h6 class="category text-primary">Price:  {{post.price}}</h6>
                <h6 class="category text-primary">Amenities:  {{post.amenities}}</h6>
                <p class="card-description">
                  {{post.comments}}
                </p>
              </div>
            </div>
            <div class="col-md-4">
              <div class="row">
                <!-- <div class="btn btn-success">
                    <a class="text-white" href="{{post.Map}}">
                    Map
                    </a>
                </div> -->
              </div>
              <div class="row">
                <div class="btn btn-success">
                    <a class="text-white" href="{{post.tripadvisor}}">
                    Trip Advisor
                    </a>
                </div>
              </div>
            </div>
          </div>
        </div>
        {% endif %}
        {% endfor %}
  </div>
